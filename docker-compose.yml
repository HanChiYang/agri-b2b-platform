# 本機開發用的 PostgreSQL，帳號密碼只用在本機
name: agri-b2b

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: agri_b2b
      POSTGRES_USER: agri_b2b
      POSTGRES_PASSWORD: agri_b2b_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri_b2b -d agri_b2b"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
